name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-mac:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build DMG
        run: |
          set -o pipefail
          mkdir -p action-logs
          DEBUG=electron-builder npx electron-builder --mac dmg --x64 --publish never --config electron-builder.json5 2>&1 | tee action-logs/build-dmg.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-logs
          path: action-logs/*.log

      - name: Publish build log summary
        if: always()
        run: |
          if [ -f action-logs/build-dmg.log ]; then
            {
              echo "## Build DMG log tail"
              echo '```text'
              tail -n 160 action-logs/build-dmg.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/**/*.dmg
